<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PingU · Mi perfil</title>
    <link rel="stylesheet" href="perfil.css">
</head>

<body>
    <header class="topbar">
        <div class="topbar-left">
            <h1>Mi perfil</h1>
        </div>

        <div class="topbar-right">
            <button onclick="desconexion()" class="logoutButton">Desconexión ⏻</button>
        </div>
    </header>

    <div class="container-layout">
        <div class="sidebar">
            <a href="home.html"><button class="button">Inicio</button></a>
            <a href="perfil.html"><button class="button">Mi perfil</button></a>
            <a href="usuarios.html"><button class="button">Usuarios</button></a>
            <a href="followers.html"><button class="button">Seguidores</button></a>
            <a href="follows.html"><button class="button">Seguidos</button></a>
            <a href="misPost.html"><button class="button">Mis post</button></a>
            <div class="sidebar-logo">
                <img src="PingUsf.png" alt="PingU">
            </div>
        </div>

        <div class="main">
            <div class="perfil-card">
                <div class="title">PERFIL DE USUARIO</div>

                <div class="main-content">
                    <div class="top-section">
                        <div class="left-column">
                            <div class="profile-photo-box">
                                <img id="fotoPerfil" src="atlas.jpeg" alt="Foto de perfil">
                            </div>
                        </div>

                        <div class="center-column">
                            <div class="info-section">
                                <div class="info-item">
                                    <label class="info-label">Miembro desde:</label>
                                    <input type="text" id="fechaAlta" class="info-input readonly" readonly>
                                </div>

                                <div class="info-item">
                                    <label class="info-label">Alias:</label>
                                    <input type="text" id="alias" class="info-input readonly" readonly>
                                </div>

                                <div class="info-item">
                                    <label class="info-label">Nombre visible:</label>
                                    <input type="text" id="nombreVisible" class="info-input">
                                </div>

                                <div class="info-item">
                                    <label class="info-label">Correo electrónico:</label>
                                    <input type="text" id="correo" class="info-input readonly" readonly>
                                </div>

                                <div class="info-item">
                                    <label class="info-label">Seguidores:</label>
                                    <input type="text" id="seguidores" class="info-input readonly" readonly>
                                </div>

                                <div class="info-item">
                                    <label class="info-label">Seguidos:</label>
                                    <input type="text" id="seguidos" class="info-input readonly" readonly>
                                </div>

                                <div class="info-item">
                                    <label class="info-label">Nueva contraseña:</label>
                                    <input type="password" id="contrasena" class="info-input"
                                        placeholder="Escribe una nueva contraseña">
                                </div>

                                <div class="info-item">
                                    <label class="info-label">Repetir contraseña:</label>
                                    <input type="password" id="repetirContrasena" class="info-input"
                                        placeholder="Repite la nueva contraseña">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="biografia-section">
                        <div class="biografia-title">Biografía:</div>
                        <textarea id="biografia" class="biografia-input"
                            placeholder="Escribe aquí tu biografía..."></textarea>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn-delete" onclick="eliminarCuenta()">Eliminar cuenta</button>

                    <div class="actions-right">
                        <button class="btn btn-cancel" onclick="cancelarCambios()">Cancelar</button>
                        <button class="btn btn-save" onclick="guardarPerfil()">Guardar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <a href="nuevoPost.html" class="floating-post-btn">+</a>

    <script src="perfil.js"></script>
</body>

</html>F
