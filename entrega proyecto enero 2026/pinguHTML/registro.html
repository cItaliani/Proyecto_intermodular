<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PingU · Registro</title>
    <link rel="stylesheet" href="Registro.css">
    <link rel="shortcut icon" href="PingUsf.ico" type="image/x-icon">
</head>
<body>

<div class="container">

    <div class="header">
        <img src="letras sin fondo.png" alt="">
        <p>Prepárate… esto empieza contigo 😉</p>
    </div>

    <form class="form-horizontal">

        <div class="row">
            <div class="field">

                <input type="text" placeholder="nombre" name="nombre">
            </div>
            <div class="field">
                <input type="text" placeholder="primer apellido"name="apellido1">
            </div>
            <div class="field">
                <input type="text" placeholder="segundo apellido"name="apellido2">
            </div>
        </div>

        <div class="row">
            <div class="field wide">
                <input type="text" placeholder="nombre de usuario" name="alias">
            </div>
            <div class="field wide">
                <input type="email" placeholder=" correo electronico" name="email">
            </div>
        </div>

        <div class="row">
            <div class="field wide">
                <input type="password" id="pass" placeholder="contraseña" name="pass">
            </div>
            <div class="field wide">
                <input type="password" id="pass2" placeholder="repite la contraseña" name="pass2">
            </div>
        </div>

        <div class="actions">
            <button type="submit">Desbloquear acceso 🔒</button>
        </div>

        <div class="footer">
            <a href="Index.html">volver a la pantalla de login</a>
        </div>

    </form>

</div>

<script src="Registro.js"></script>
</body>
</html>
