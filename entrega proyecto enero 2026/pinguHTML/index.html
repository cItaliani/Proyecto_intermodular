<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>PingU · Conecta. Comparte. Sonrie</title>
    <link rel="stylesheet" href="Index.css">
    <link rel="shortcut icon" href="PingUsf.ico" type="image/x-icon">
</head>

<body>

    <div class="caja">

        <div class="izquierda">
            <img src="logo.png" alt="PingU logo" class="logo">
        </div>

        <div class="derecha">
            <form action="misPost.html" method="post" id="loginForm">
                <div class="formulario">
                    <input type="text" id="usuario" placeholder="usuario">
                    <div class="checkbox">
                        <label for="recordarUsuario">recordar usuario</label>
                        <input type="checkbox" id="recordarUsuario">
                    </div>
                </div>

                <div class="formulario">
                    <input type="password" id="password" placeholder="contraseña">
                    <div class="options">
                        <a href="recuperarContrasena.html">¿Has olvidado tu contraseña?</a>
                        <div class="checkbox">
                            <label for="mostrar">mostrar contraseña</label>
                            <input type="checkbox" id="mostrar">
                        </div>

                        <div class="checkbox">
                            <label for="recordarCredenciales">recordar credenciales</label>
                            <input type="checkbox" id="recordarCredenciales">
                        </div>
                    </div>
                </div>

                <div class="buttons">

                    <button type="button" class="btnRegistro" onclick="window.location.href='registro.html'">
                        ¿Primera vez por aquí?<br><span>Súmate 😎</span>
                    </button>
                    <button type="submit" class="btnLogin">
                        ¿Ya eres de la casa?<br><span>Entra 🔑</span>
                    </button>
                </div>
            </form>
        </div>

    </div>

    <footer>
        <a href="Riddler.html">Riddler Company Creations</a>
        <a href="Riddler.html"><img src="logo nSF.png" alt="" height="50px" width="30px"></a>

    </footer>
    <script src="Index.js"></script>
</body>

</html>
